name = "mark-lesson-editor"
main = "worker.mjs"
compatibility_date = "2026-10-30"

[assets]
directory = "../admin"
binding = "ASSETS"
run_worker_first = true

[vars]
GITHUB_OWNER = "celjericho-cloud"
